name: Run Lint and Test before Merging Pull Request

on:
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "22.17.1"

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: swa/package-lock.json

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-question-gpt-portal-${{ hashFiles('swa/package-lock.json') }}-${{ hashFiles('swa/**.[jt]s', 'swa/**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-question-gpt-portal-${{ hashFiles('swa/package-lock.json') }}-

      - name: Lint
        uses: reviewdog/action-eslint@v1
        with:
          fail_level: error
          filter_mode: file
          level: warning
          reporter: github-pr-review
          workdir: swa
