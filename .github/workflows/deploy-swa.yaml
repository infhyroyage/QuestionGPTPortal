name: Deploy Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-swa.yaml
      - src/**
      - components.json
      - index.html
      - package*.json
      - resources/base.bicep
      - staticwebapp.config.json
      - tailwind.config.js
      - tsconfig*.json
      - vite.config.ts

jobs:
  deploy-swa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login Azure as Contributor
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ vars.AZURE_AD_SP_CONTRIBUTOR_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_AD_SP_CONTRIBUTOR_CLIENT_SECRET }}","subscriptionId":"${{ vars.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ vars.AZURE_TENANT_ID }}"}'

      - name: Get Azure Static Web Apps API Token
        id: get-swa-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            -n ${{ vars.SWA_NAME }} \
            -g ${{ vars.RESOURCE_GROUP_NAME }} \
            --query 'properties.apiKey' \
            -o tsv)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "upload"
          app_location: "/"
          azure_static_web_apps_api_token: ${{ steps.get-swa-token.outputs.token }}
          output_location: "dist"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          VITE_API_URI: ${{ vars.API_URI }}
          VITE_AZURE_AD_SP_MSAL_CLIENT_ID: ${{ vars.AZURE_AD_SP_MSAL_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
