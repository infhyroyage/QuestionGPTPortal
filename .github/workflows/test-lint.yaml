name: Run Lint and Tests before Merging Pull Request

on:
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "24.13.0"
  PYTHON_VERSION: "3.12"

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  lint-bicep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Bicep
        uses: synergy-au/bicep-lint-action@v1.1
        with:
          analyse-all-files: "true"

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ env.PYTHON_VERSION }} Environment
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint
        run: pylint functions/**/*.py

  lint-nodejs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: swa/package-lock.json

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-question-gpt-portal-${{ hashFiles('swa/package-lock.json') }}-${{ hashFiles('swa/**.[jt]s', 'swa/**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-question-gpt-portal-${{ hashFiles('swa/package-lock.json') }}-

      - name: Lint Node.js
        uses: reviewdog/action-eslint@v1
        with:
          fail_level: error
          filter_mode: file
          level: warning
          reporter: github-pr-review
          workdir: swa

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ env.PYTHON_VERSION }} Environment
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unittests with coverage
        run: |
          pushd functions
          coverage run -m unittest discover -s tests
          coverage xml
          popd

      - name: Get Cover
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: functions/coverage.xml
          thresholdAll: 0.8
          token: ${{ secrets.GITHUB_TOKEN }}
