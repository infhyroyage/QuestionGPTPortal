name: Build and Deploy Azure Static Web Apps

on:
  push:
    branches:
      - feature/migration_azure_swa # TODO: mainブランチに変更
    paths:
      - .github/workflows/build-deploy-swa.yaml
      - src/**
      - components.json
      - index.html
      - package*.json
      - postcss.config.js
      - tailwind.config.js
      - tsconfig*.json
      - vite.config.ts

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APPS_DEPLOY_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"
