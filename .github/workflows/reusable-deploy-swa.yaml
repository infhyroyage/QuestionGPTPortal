name: Deploy Azure Static Web Apps (Reusable Workflow)

on:
  workflow_call:
    inputs:
      API_URI:
        required: true
        type: string
      AZURE_AD_SP_CONTRIBUTOR_CLIENT_ID:
        required: true
        type: string
      AZURE_AD_SP_MSAL_CLIENT_ID:
        required: true
        type: string
      AZURE_SUBSCRIPTION_ID:
        required: true
        type: string
      AZURE_TENANT_ID:
        required: true
        type: string
      SWA_NAME:
        required: true
        type: string
    secrets:
      AZURE_AD_SP_CONTRIBUTOR_CLIENT_SECRET:
        required: true

env:
  RESOURCE_GROUP: qgportal-je

jobs:
  deploy-swa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login Azure as Contributor
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ inputs.AZURE_AD_SP_CONTRIBUTOR_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_AD_SP_CONTRIBUTOR_CLIENT_SECRET }}","subscriptionId":"${{ inputs.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ inputs.AZURE_TENANT_ID }}"}'

      - name: Get Azure Static Web Apps API Token
        id: get-swa-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            -n ${{ inputs.SWA_NAME }} \
            -g ${{ env.RESOURCE_GROUP }} \
            --query 'properties.apiKey' \
            -o tsv)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "upload"
          app_location: "/"
          azure_static_web_apps_api_token: ${{ steps.get-swa-token.outputs.token }}
          output_location: "dist"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          VITE_API_URI: ${{ inputs.API_URI }}
          VITE_AZURE_AD_SP_MSAL_CLIENT_ID: ${{ inputs.AZURE_AD_SP_MSAL_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
