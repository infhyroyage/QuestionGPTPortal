services:
  localcosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: localcosmosdb
    tty: true
    ports:
      - 1234:1234
      - 8081:8081
      - 10251:10251
      - 10252:10252
      - 10253:10253
      - 10254:10254
      - 10255:10255
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
    # fuse-overlayfsストレージドライバー環境では、イメージ下位レイヤー上のファイル削除が"Invalid cross-device link"(EXDEV)となって
    # PostgreSQLが起動失敗するため、/dataを名前付きボリュームにマウントし、実ファイルシステム上で内蔵PostgreSQLを動作させることで回避する
    volumes:
      - ./cosmosdata:/data
  localstorage:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: localstorage
    ports:
      - 10000:10000
      - 10001:10001
      - 10002:10002
    volumes:
      - ./azurite:/data

volumes:
  cosmosdata:
