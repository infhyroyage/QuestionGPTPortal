services:
  localcosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: localcosmosdb
    tty: true
    ports:
      - 1234:1234
      - 8081:8081
      - 10251:10251
      - 10252:10252
      - 10253:10253
      - 10254:10254
      - 10255:10255
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
    # fuse-overlayfsストレージドライバー環境では、イメージ下位レイヤー上のファイル削除が"Invalid cross-device link"(EXDEV)となり、
    # 内蔵PostgreSQLが起動失敗するため、/dataを名前付きボリューム"cosmosdata"にマウントし、実ファイルシステム上で
    # 内蔵PostgreSQLを動作させることで回避する
    volumes:
      - cosmosdata:/data
  localstorage:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: localstorage
    # azure-storage-queue 12.17.0 以降は既定 REST API が Azurite 未対応のため、
    # Functions ホスト等からの接続でも InvalidHeaderValue にならないよう API バージョン検査をスキップする。
    # command を上書きする場合、ホストから接続できるよう --blobHost/--queueHost/--tableHost と永続化先が必要。
    command:
      - azurite
      - --blobHost
      - "0.0.0.0"
      - --queueHost
      - "0.0.0.0"
      - --tableHost
      - "0.0.0.0"
      - --location
      - /data
      - --skipApiVersionCheck
    ports:
      - 10000:10000
      - 10001:10001
      - 10002:10002
    volumes:
      - ./azurite:/data

volumes:
  cosmosdata:
